* { margin: 0; padding: 0; box-sizing: border-box; }

/* ==================== WIDGET DE CLIMA E HORÁRIO ==================== */
#weather-widget {
  background: linear-gradient(135deg, #1f1f1f 0%, #262626 100%);
  border: 1px solid #333;
  border-radius: 10px;
  padding: 8px 12px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.8);
}

.weather-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.weather-left, .weather-right {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.weather-center {
  flex: 1;
  text-align: center;
}

.sunrise-time { color:#FFB347; font-weight:600; }
.sunset-time  { color:#FF6B6B; font-weight:600; }

.compact-line { font-size:0.85rem; color:#bdbdbd; }
.line-2 { font-weight:bold; color:#e6e6e6; }
