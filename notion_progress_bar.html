<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Viagens – Original + Local Atual</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#0d0d0d;
    color:#fff;
}

.widget{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
}

.card{
    background:#1f1f1f;
    border:1px solid #2e2e2e;
    border-radius:10px;
    padding:12px;
    text-align:center;
    box-shadow:0 4px 8px rgba(0,0,0,.3);
}

.card h3{
    font-size:.85rem;
    margin-bottom:6px;
    color:#aaa;
}

.card p{
    font-size:1rem;
    font-weight:bold;
}

.flag{
    width:24px;
    height:16px;
    object-fit:cover;
    border-radius:3px;
    margin-bottom:6px;
}
</style>
</head>

<body>

<div class="widget">

  <!-- LOCAL ATUAL -->
  <div class="card">
    <h3 id="local-name">Local atual</h3>
    <p id="local-time">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/br.png">
    <h3>Brasil</h3>
    <p id="br">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/pt.png">
    <h3>Portugal</h3>
    <p id="pt">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/es.png">
    <h3>Espanha</h3>
    <p id="es">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/fr.png">
    <h3>França</h3>
    <p id="fr">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/gb.png">
    <h3>Reino Unido</h3>
    <p id="uk">--:--</p>
  </div>

  <div class="card">
    <img class="flag" src="https://flagcdn.com/w20/it.png">
    <h3>Itália</h3>
    <p id="it">--:--</p>
  </div>

</div>

<script>
let localTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

// ================== GEOLOCALIZAÇÃO EM TEMPO REAL ==================
if (navigator.geolocation) {
    navigator.geolocation.watchPosition(async pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // Nome da cidade
        try{
            const geo = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`
            );
            const data = await geo.json();
            const a = data.address || {};
            document.getElementById("local-name").textContent =
              a.city || a.town || a.village || "Local atual";
        }catch{}

        // Timezone real pela posição
        try{
            const tz = await fetch(
              `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`
            );
            const tzData = await tz.json();
            localTimezone = tzData.timezone;
        }catch{}
    });
}

// ================== RELÓGIOS ==================
function updateClocks(){
    const now = new Date();

    const zones = {
        br: "America/Sao_Paulo",
        pt: "Europe/Lisbon",
        es: "Europe/Madrid",
        fr: "Europe/Paris",
        uk: "Europe/London",
        it: "Europe/Rome"
    };

    for(const id in zones){
        document.getElementById(id).textContent =
            new Intl.DateTimeFormat("pt-BR",{
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                timeZone:zones[id]
            }).format(now);
    }

    document.getElementById("local-time").textContent =
        new Intl.DateTimeFormat("pt-BR",{
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            timeZone:localTimezone
        }).format(now);
}

updateClocks();
setInterval(updateClocks,1000);
</script>

</body>
</html>
