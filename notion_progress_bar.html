<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Viagens & Clima Real-Time</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #ffffff; padding: 25px; }

    /* WIDGET DE CLIMA */
    #weather-widget {
        background: linear-gradient(135deg, #1f1f1f 0%, #262626 100%);
        border: 1px solid #333;
        border-radius: 10px;
        padding: 10px 15px;
        margin-bottom: 15px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
    .weather-container { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .weather-left, .weather-right { flex: 1; display: flex; align-items: center; gap: 6px; }
    .weather-right { justify-content: flex-end; }
    .sunrise-time { font-weight: 600; color: #FFB347; }
    .sunset-time { font-weight: 600; color: #FF6B6B; }
    .weather-center { flex: 2; text-align: center; display: flex; flex-direction: column; gap: 2px; }
    .compact-line { font-size: 0.85rem; color: #bdbdbd; white-space: nowrap; }
    .line-2 { font-weight: bold; color: #e6e6e6; margin-top: 2px; }

    /* WIDGET DE VIAGENS */
    #next-destination { background: #1f1f1f; border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 18px; text-align: center; }
    #trips-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
    .trip-card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; }
    .progress-wrapper { position: relative; height: 26px; background: #222; border-radius: 20px; overflow: hidden; margin-top: 6px; }
    .progress-fill { position: absolute; height: 100%; width: 0%; transition: width 0.6s linear; }
    .progress-percent, .extra-msg-overlay { position: absolute; width: 100%; text-align: center; top: 50%; transform: translateY(-50%); font-size: 0.78rem; font-weight: 600; z-index: 10; }
    .emoji-icon { position: absolute; top: 50%; transform: translateY(-50%); font-size: 20px; transition: left 0.5s ease; }
    .status { color: #e6e6e6; font-weight: 600; font-size: 0.9rem; }
    .sub { color: #bdbdbd; font-size: 0.82rem; }
    .country-flag { width: 18px; height: 14px; margin-left: 6px; vertical-align: middle; }
    @keyframes jump { from { transform: translateY(-50%); } to { transform: translateY(-80%); } }
    .emoji-jump { animation: jump 0.6s infinite alternate; }
</style>
</head>
<body>

<div id="weather-widget">
    <div class="weather-container">
        <div class="weather-left">
            <span>🌅</span>
            <div><div style="font-size: 0.7rem; color: #999;">Nascer</div><div class="sunrise-time" id="sunrise-time">--:--</div></div>
        </div>
        <div class="weather-center">
            <div id="weather-line-1" class="compact-line line-1">Detectando localização...</div>
            <div id="weather-line-2" class="compact-line line-2">Carregando clima...</div>
        </div>
        <div class="weather-right">
            <div><div style="font-size: 0.7rem; color: #999; text-align: right;">Pôr do sol</div><div class="sunset-time" id="sunset-time">--:--</div></div>
            <span>🌇</span>
        </div>
    </div>
</div>

<div id="next-destination">Próximo destino: carregando...</div>
<div id="trips-container"></div>

<script>

let globalLocationName = "Localização não autorizada";
let lastCoords = { lat: null, lon: null };

// SISTEMA DE LOCALIZAÇÃO E CLIMA
async function getCityName(lat, lon) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
        const data = await res.json();
        const city = data.address.city || data.address.town || data.address.village || "Desconhecido";
        return `${city}, ${data.address.country_code.toUpperCase()}`;
    } catch { return "Erro ao obter local"; }
}

async function updateWeatherData(lat, lon) {
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`);
        const data = await res.json();
        const current = data.current;
        const daily = data.daily;
        
        document.getElementById('sunrise-time').textContent = daily.sunrise[0].split('T')[1];
        document.getElementById('sunset-time').textContent = daily.sunset[0].split('T')[1];
        
        const weatherMap = { 0: ["☀️","Céu Limpo"], 1: ["🌤️","Limpo"], 2: ["⛅","Parcial. Nublado"], 3: ["☁️","Nublado"], 45: ["🌫️","Neblina"], 61: ["🌧️","Chuva Leve"], 95: ["⛈️","Tempestade"] };
        const [icon, desc] = weatherMap[current.weather_code] || ["🌡️", "Clima"];
        
        document.getElementById('weather-line-2').textContent = `${icon} ${Math.round(current.temperature_2m)}°C | ${desc} (Máx: ${Math.round(daily.temperature_2m_max[0])}°C Mín: ${Math.round(daily.temperature_2m_min[0])}°C)`;
    } catch (e) { console.error("Erro clima", e); }
}

function initLocationTracking() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        // Só atualiza se mudar mais de 0.01 grau (evita spam de API)
        if (Math.abs(lastCoords.lat - latitude) > 0.01 || Math.abs(lastCoords.lon - longitude) > 0.01) {
            lastCoords = { lat: latitude, lon: longitude };
            globalLocationName = await getCityName(latitude, longitude);
            updateWeatherData(latitude, longitude);
        }
    }, () => {
        globalLocationName = "S. Paulo, BR (Padrão)";
        updateWeatherData(-23.55, -46.63);
    }, { enableHighAccuracy: true });
}

function updateDateTime() {
    const now = new Date();
    const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const timeStr = now.toLocaleTimeString('pt-BR');
    const dateStr = now.toLocaleDateString('pt-BR');
    document.getElementById('weather-line-1').textContent = `${days[now.getDay()]} | ${dateStr} | ${timeStr} | ${globalLocationName}`;
}

// LÓGICA DE VIAGENS
function formatCountdown(ms) {
    if (ms <= 0) return "Viagem Concluída!";
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return `${d}d ${h}h ${m}m ${s % 60}s`;
}

function renderTrips() {
    const container = document.getElementById('trips-container');
    container.innerHTML = TRIPS.map((trip, i) => `
        <div class="trip-card" id="trip-${i}">
            <div class="title-row">
                <h3>${trip.emoji} ${trip.title}</h3>
                <div class="sub">${new Date(trip.date).toLocaleDateString('pt-BR')}</div>
            </div>
            <div class="progress-wrapper">
                <div class="progress-fill" style="background: #4b6b82">
                    <div class="extra-msg-overlay"></div>
                </div>
                <div class="progress-percent">0%</div>
                <div class="emoji-icon">${trip.emoji}</div>
            </div>
            <div class="status">Calculando...</div>
            <div class="sub countdown">--</div>
        </div>
    `).join('');
}

    let nextTrip = null, minMs = Infinity;

    TRIPS.forEach((trip, i) => {

        const target = new Date(trip.date);
        const msLeft = target - now;
        const pct = Math.max(0, Math.min(100, ((
