<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Viagens – Completo com Clima (v5 - Ultra Compacto)</title>
<style>
    /* MANTIDO EXATAMENTE COMO O ORIGINAL */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #ffffff; padding: 25px; }
    #weather-widget { background: linear-gradient(135deg, #1f1f1f 0%, #262626 100%); border: 1px solid #333; border-radius: 10px; padding: 8px 12px; margin-bottom: 15px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.8); }
    .weather-container { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .weather-left, .weather-right { flex: 1; display: flex; align-items: center; gap: 6px; }
    .weather-left { justify-content: flex-start; }
    .weather-right { justify-content: flex-end; }
    .sunrise-info, .sunset-info { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; }
    .sunrise-time { font-weight: 600; color: #FFB347; }
    .sunset-time { font-weight: 600; color: #FF6B6B; }
    .weather-center { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .compact-line { font-size: 0.85rem; color: #bdbdbd; white-space: nowrap; }
    .line-1 { font-weight: normal; }
    .line-2 { font-weight: bold; color: #e6e6e6; margin-top: 2px; }
    .country-flag { width: 18px; height: 14px; object-fit: cover; border-radius: 2px; margin-left: 6px; }
    #next-destination { background: #1f1f1f; border: 1px solid #333; padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 1.05rem; text-align: center; }
    #trips-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
    .trip-card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 14px; box-shadow: 0 0 8px rgba(0,0,0,0.6); text-align: left; display: flex; flex-direction: column; gap: 8px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .title-row h3 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .progress-wrapper { position: relative; height: 26px; background: #222; border-radius: 20px; overflow: hidden; margin-top: 6px; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; transition: width 0.6s linear, background 0.3s linear; }
    .progress-percent { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.78rem; font-weight: 600; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); z-index: 10; }
    .extra-msg-overlay { position: absolute; left: 0; right: 0; text-align: center; font-size: 0.78rem; font-weight: 600; color: #000000; text-shadow: 0 1px 2px rgba(255,255,255,0.6); top: 50%; transform: translateY(-50%); z-index: 10; }
    .emoji-icon { position: absolute; top: 50%; transform: translateY(-50%); font-size: 20px; transition: left 0.5s ease, transform 0.25s ease; }
    .emoji-jump { animation: jump 0.6s infinite alternate; }
    @keyframes jump { from { transform: translateY(-50%); } to { transform: translateY(-80%); } }
    .status { color: #e6e6e6; font-weight: 600; font-size: 0.9rem; }
    .sub { color: #bdbdbd; font-size: 0.82rem; }
    .scale-info { color: #bdbdbd; font-size: 0.85rem; }
    .countdown { color: #27ae60 !important; }
    @media (max-width: 1024px) { #trips-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { #trips-container { grid-template-columns: 1fr; } .weather-container { flex-direction: column; } }
</style>
</head>
<body>

<div id="weather-widget">
    <div class="weather-container">
        <div class="weather-left">
            <div class="sunrise-info">
                <span>🌅</span>
                <div>
                    <div style="font-size: 0.8rem; color: #999;">Nascer do sol</div>
                    <div class="sunrise-time" id="sunrise-time">--:--</div>
                </div>
            </div>
        </div>
        <div class="weather-center">
            <div id="weather-line-1" class="compact-line line-1">Carregando Data, Hora e Localização...</div>
            <div id="weather-line-2" class="compact-line line-2">Carregando Clima...</div>
        </div>
        <div class="weather-right">
            <div class="sunset-info">
                <div>
                    <div style="font-size: 0.8rem; color: #999;">Pôr do sol</div>
                    <div class="sunset-time" id="sunset-time">--:--</div>
                </div>
                <span>🌇</span>
            </div>
        </div>
    </div>
</div>

<div id="next-destination">Próximo destino: carregando...</div>
<div id="trips-container"></div>

<script>
// Variável Global para persistência da localização entre atualizações do relógio
let currentGlobalLocation = "Localizando...";

const FLAGS = { 'Guarulhos': 'https://flagcdn.com/w20/br.png', 'Lisboa': 'https://flagcdn.com/w20/pt.png', 'Madri': 'https://flagcdn.com/w20/es.png', 'Paris': 'https://flagcdn.com/w20/fr.png', 'Londres': 'https://flagcdn.com/w20/gb.png', 'Roma': 'https://flagcdn.com/w20/it.png', 'Milão': 'https://flagcdn.com/w20/it.png', 'Civitavecchia': 'https://flagcdn.com/w20/it.png', 'Valência': 'https://flagcdn.com/w20/es.png', 'Barcelona': 'https://flagcdn.com/w20/es.png', 'Marselha': 'https://flagcdn.com/w20/fr.png', 'Gênova': 'https://flagcdn.com/w20/it.png', 'Livorno': 'https://flagcdn.com/w20/it.png' };

const TRIPS = [
    { title: "Guarulhos → Lisboa", emoji: "✈️", date: "2025-12-19T16:20:00", arrival: "05:15", type: "flight" },
    { title: "Lisboa → Madri", emoji: "✈️", date: "2025-12-23T18:00:00", arrival: "20:20", type: "flight" },
    { title: "Madri → Paris", emoji: "✈️", date: "2025-12-27T14:25:00", arrival: "16:30", type: "flight" },
    { title: "Paris → Londres", emoji: "🚄", date: "2026-01-02T16:12:00", arrival: "17:30", type: "train" },
    { title: "Londres → Roma", emoji: "✈️", date: "2026-01-08T16:40:00", arrival: "22:40", scale: "Escala em Milão (19:30–21:30)", type: "flight" },
    { title: "Civitavecchia", emoji: "🚢", date: "2026-01-15T11:00:00", embark: "11:00", depart: "2026-01-15T19:00:00", type: "cruise-start" },
    { title: "Valência", emoji: "🛳️", date: "2026-01-17T07:00:00", type: "cruise-stop", depart: "2026-01-17T21:00:00" },
    { title: "Barcelona", emoji: "🛳️", date: "2026-01-18T08:00:00", type: "cruise-stop", depart: "2026-01-18T18:00:00" },
    { title: "Marselha", emoji: "🛳️", date: "2026-01-19T08:00:00", type: "cruise-stop", depart: "2026-01-19T18:00:00" },
    { title: "Gênova", emoji: "🛳️", date: "2026-01-20T08:00:00", type: "cruise-stop", depart: "2026-01-20T19:00:00" },
    { title: "Livorno", emoji: "🛳️", date: "2026-01-21T07:00:00", type: "cruise-stop", depart: "2026-01-21T20:00:00" },
    { title: "Civitavecchia", emoji: "🚢", date: "2026-01-22T07:00:00", arrival: "07:00", type: "cruise-end" },
    { title: "Roma → Madri", emoji: "✈️", date: "2026-01-22T14:45:00", arrival: "17:20", type: "flight" },
    { title: "Madri → Lisboa", emoji: "✈️", date: "2026-01-22T21:10:00", arrival: "21:35", type: "flight" },
    { title: "Lisboa → Guarulhos", emoji: "✈️", date: "2026-01-22T23:30:00", arrival: "06:50", type: "flight" }
];

const MAX_WINDOW_MS = 30 * 24 * 60 * 60 * 1000;
const DAY_MS = 86400000;

// ==================== CORREÇÃO DA LOCALIZAÇÃO REAL-TIME ====================

function initRealTimeLocation() {
    if (navigator.geolocation) {
        // watchPosition atualiza automaticamente sempre que o sensor detecta movimento
        navigator.geolocation.watchPosition(
            async (position) => {
                const { latitude, longitude } = position.coords;
                currentGlobalLocation = await getCityName(latitude, longitude);
                updateWeatherWidget(latitude, longitude);
            },
            (error) => {
                console.warn("Erro ao rastrear:", error);
                currentGlobalLocation = "São Paulo, Brasil"; // Fallback
            },
            { enableHighAccuracy: true, maximumAge: 30000, timeout: 27000 }
        );
    }
}

async function getCityName(latitude, longitude) {
    try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10`;
        const response = await fetch(url);
        const data = await response.json();
        const address = data.address;
        return (address.city || address.town || address.village || 'Localização Desconhecida') + ", " + (address.country || '');
    } catch (error) { return "Localização Offline"; }
}

async function updateWeatherWidget(latitude, longitude) {
    const weatherData = await getWeatherData(latitude, longitude);
    if (!weatherData) return;
    const weatherInfo = getWeatherInfo(weatherData.weather_code);
    document.getElementById('sunrise-time').textContent = formatTime(weatherData.sunrise);
    document.getElementById('sunset-time').textContent = formatTime(weatherData.sunset);
    document.getElementById('weather-line-2').textContent = `${weatherInfo.icon} ${weatherData.current_temp}°C | ${weatherInfo.description} (Max: ${weatherData.max_temp}°C Min: ${weatherData.min_temp}°C)`;
}

// Funções de clima e tempo mantidas iguais
async function getWeatherData(latitude, longitude) {
    try {
        const today = new Date().toISOString().split('T')[0];
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&start_date=${today}&end_date=${today}`;
        const response = await fetch(url);
        const data = await response.json();
        return { current_temp: Math.round(data.current.temperature_2m), weather_code: data.current.weather_code, max_temp: Math.round(data.daily.temperature_2m_max[0]), min_temp: Math.round(data.daily.temperature_2m_min[0]), sunrise: data.daily.sunrise[0], sunset: data.daily.sunset[0] };
    } catch (error) { return null; }
}

function getWeatherInfo(weatherCode) {
    if (weatherCode <= 1) return { icon: "☀️", description: "Ensolarado" };
    if (weatherCode <= 3) return { icon: "⛅", description: "Parcialmente Nublado" };
    if (weatherCode <= 48) return { icon: "🌫️", description: "Neblina" };
    if (weatherCode <= 67) return { icon: "🌧️", description: "Chuva" };
    if (weatherCode <= 99) return { icon: "⛈️", description: "Tempestade" };
    return { icon: "☀️", description: "Desconhecido" };
}

function formatTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function updateDateTime() {
    const now = new Date();
    const daysOfWeek = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const dateDisplay = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
    const timeDisplay = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    document.getElementById('weather-line-1').textContent = `${daysOfWeek[now.getDay()]} | ${dateDisplay} | ${timeDisplay} | ${currentGlobalLocation}`;
}

// ==================== LÓGICA DE VIAGENS (MANTIDA) ====================

function cleanLocation(raw) { return raw.replace(/[☀-➿]/g, '').replace(/[()]/g, '').replace(/–.*/g, '').trim(); }
function parseScaleTimes(trip) {
    if (!trip.scale) return null;
    const match = trip.scale.match(/Escala em (.+?) \((.+?)–(.+?)\)/);
    return match ? { location: match[1], arrive1: match[2], depart2: match[3] } : null;
}
function createDateFromTime(baseDate, timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    const newDate = new Date(baseDate);
    newDate.setHours(h, m, 0, 0);
    return newDate;
}
function getOriginDest(title) {
    if (title.includes('→')) {
        const parts = title.split('→').map(p => cleanLocation(p));
        return { from: parts[0].trim(), to: parts[1].trim() };
    }
    const single = cleanLocation(title);
    return { from: single, to: single };
}
function flagForUrl(loc) { return FLAGS[loc] || null; }
function clamp(v, a = 0, b = 100) { return Math.max(a, Math.min(b, v)); }
function getColorForTimeLeft(msLeft) {
    const daysLeft = msLeft / DAY_MS;
    if (msLeft <= 0) return "#27AE60";
    if (daysLeft <= 9) return "#33FF33";
    if (daysLeft <= 30) return "#E74C3C";
    return "#4b6b82";
}
function formatCountdown(targetMs, nowMs) {
    const diff = targetMs - nowMs;
    if (diff <= 0) return "0 dias 0h 0m 0s";
    const s = Math.floor(diff / 1000);
    const dias = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    return `${dias} dias ${h}h ${m}m ${s % 60}s`;
}
function createTripCard(trip) {
    const odCard = getOriginDest(trip.title);
    const destFlag = flagForUrl(odCard.to) ? `<img class='country-flag' src='${flagForUrl(odCard.to)}' />` : '';
    const originFlag = (flagForUrl(odCard.from) && !trip.type.includes("cruise")) ? `<img class='country-flag' src='${flagForUrl(odCard.from)}' />` : '';
    const card = document.createElement('div');
    card.className = 'trip-card';
    card.innerHTML = `
        <div class="title-row">
            <h3>${trip.type.includes("cruise") ? odCard.to + destFlag : originFlag + odCard.from + " → " + odCard.to + destFlag}</h3>
            <div class="sub">${new Date(trip.date).toLocaleDateString('pt-BR')}</div>
        </div>
        ${trip.scale ? `<div class="scale-info">✈️ <i>${trip.scale}</i></div>` : ''}
        <div class="progress-wrapper">
            <div class="progress-fill" data-dynamic="fill"><div class="extra-msg-overlay" data-dynamic="extra-msg"></div></div>
            <div class="progress-percent" data-dynamic="percent">0%</div>
            <div class="emoji-icon" data-dynamic="emoji">${trip.type === 'train' ? '🚆' : trip.type.startsWith('cruise') ? '🚢' : '✈️'}</div>
        </div>
        <div class="status" data-dynamic="status"></div>
        <div class="sub countdown" data-dynamic="countdown"></div>
    `;
    return card;
}
function updateTripCard(cardElement, trip, now) {
    const target = new Date(trip.date);
    let msLeft = target - now;
    let progressPct = msLeft <= 0 ? 100 : clamp(((MAX_WINDOW_MS - msLeft) / MAX_WINDOW_MS) * 100, 0, 100);
    const color = getColorForTimeLeft(msLeft);
    const fill = cardElement.querySelector('[data-dynamic="fill"]');
    const msg = cardElement.querySelector('[data-dynamic="extra-msg"]');
    const percent = cardElement.querySelector('[data-dynamic="percent"]');
    const emoji = cardElement.querySelector('[data-dynamic="emoji"]');
    const status = cardElement.querySelector('[data-dynamic="status"]');
    const countdown = cardElement.querySelector('[data-dynamic="countdown"]');

    fill.style.width = `${progressPct}%`;
    fill.style.backgroundColor = color;
    percent.textContent = `${Math.round(progressPct)}%`;
    emoji.style.left = `calc(${progressPct}% - 10px)`;
    if (progressPct > 0 && progressPct < 100) emoji.classList.add('emoji-jump');
    
    if (msLeft <= 0) {
        msg.textContent = "Viagem concluída";
        msg.style.display = 'block';
        percent.style.display = 'none';
        countdown.textContent = "Viagem Concluída!";
    } else {
        msg.style.display = 'none';
        percent.style.display = 'block';
        countdown.textContent = formatCountdown(target.getTime(), now.getTime());
        countdown.style.color = color;
    }
    status.textContent = `Partida: ${target.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;
}

function findNextTrip(now) {
    let next = TRIPS.find(t => new Date(t.date) > now);
    const el = document.getElementById('next-destination');
    if (next) el.innerHTML = `Próximo destino: <b>${next.title}</b> — ${new Date(next.date).toLocaleString('pt-BR')}`;
}

function renderTrips() {
    const container = document.getElementById('trips-container');
    container.innerHTML = '';
    TRIPS.forEach(trip => {
        const card = createTripCard(trip);
        card.dataset.tripIndex = TRIPS.indexOf(trip);
        container.appendChild(card);
    });
}

function updateAllCards() {
    const now = new Date();
    document.querySelectorAll('.trip-card').forEach(card => {
        updateTripCard(card, TRIPS[card.dataset.tripIndex], now);
    });
    findNextTrip(now);
}

// ==================== INIT ====================

function init() {
    renderTrips();
    updateAllCards();
    setInterval(updateAllCards, 1000);
    setInterval(updateDateTime, 1000);
    
    // Inicia o rastreamento em tempo real da localização
    initRealTimeLocation();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
